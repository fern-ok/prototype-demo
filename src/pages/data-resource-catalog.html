<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }

    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }

    @media (max-width: 1024px) {
      ::-webkit-scrollbar {
        display: none;
      }

      html,
      body {
        scrollbar-width: none;
      }
    }
  </style>
</head>

<body>
  <script>
    (function () {
      if (document.body && window.location.pathname.includes('/components/')) {
        document.body.classList.add('is-element-page');
      } else if (!document.body) {
        document.addEventListener('DOMContentLoaded', function () {
          if (window.location.pathname.includes('/components/')) {
            document.body.classList.add('is-element-page');
          }
        });
      }
    })();
  </script>

  <div id="root"></div>

  <script type="module" src="../assets/html-template-bootstrap.js"></script>

  <script type="module">
    function waitForBootstrap(timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const startedAt = Date.now();

        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }

          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap initialization timeout'));
            return;
          }

          setTimeout(check, 10);
        }

        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`[Html Template] Failed to load entry script: ${src}`));
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        const bootstrap = await waitForBootstrap();
        const { renderComponent, React, ReactDOM } = bootstrap;

        window.React = React;
        window.ReactDOM = ReactDOM;

        await loadEntryScript('./data-resource-catalog.js');

        const Component = window.UserComponent?.Component || window.UserComponent?.default || window.UserComponent;
        if (!Component) {
          throw new Error('[Html Template] Entry script did not expose UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] Failed to initialize page', error);
      }
    }

    bootstrapAndRender();
  </script>
</body>

</html>
